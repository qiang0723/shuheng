name: shuheng

services:
  tooling:
    build:
      context: .
      dockerfile: Dockerfile
    image: shuheng-quant:local
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
    command: ["python", "-m", "ops.verify_runtime", "--strict"]
